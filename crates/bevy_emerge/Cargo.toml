[package]
name = "bevy_emerge"
version = "0.1.1"
edition = "2024"
description = "Renamed to bevy_grimoire. The runtime half of emerge: load a library and a map, and put it in a Bevy world."
# Relicensed MIT OR Apache-2.0 on extraction from foundation_vs_slop (owner decision, Sanctuary decision 0087).
license = "MIT OR Apache-2.0"
repository = "https://github.com/bevy-coven/bevy_grimoire"

# **The only crate in the set that knows what a renderer is on purpose.** `bevy_emerge_core` is the schema
# and the solvers and has no engine (`crates/bevy_emerge_core/tests/engine_free.rs` fails the build if that
# stops being true); this turns its data into entities. The game and `bevy_emerge_mapper` both depend on
# THIS rather than each growing a spawner, so a map looks the same in the editor and in play.
[dependencies]
bevy_emerge_core = { path = "../bevy_emerge_core", version = "0.1.1" }
bevy = { workspace = true, features = ["jpeg"] }
